<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator | Free Tools Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; color: #eef2ff; }
    .container { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
    .site-header { background: #0a0a0f; border-bottom: 1px solid #2d2d44; padding: 16px 0; position: sticky; top: 0; z-index: 100; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .logo h1 { font-size: 1.6rem; background: linear-gradient(135deg, #a855f7, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .back-home { color: #a78bfa; text-decoration: none; padding: 8px 18px; border: 1px solid #7c3aed; border-radius: 40px; transition: 0.2s; }
    .back-home:hover { background: #7c3aed20; color: #c084fc; }
    .tool-hero { padding: 40px 0 24px; }
    .tool-card { background: #111118; border-radius: 32px; border: 1px solid #2d2d44; padding: 40px; margin: 20px 0 60px; }
    .tool-title { font-size: 2rem; margin-bottom: 28px; display: flex; gap: 12px; align-items: center; color: #c084fc; }
    .input-group { margin-bottom: 24px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 24px; }
    label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    input, button { font-family: inherit; border-radius: 60px; border: none; padding: 12px 20px; background: #1a1a2e; color: white; }
    input { border: 1px solid #7c3aed; background: #0a0a0f; }
    button { background: #7c3aed; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #a855f7; }
    .output { background: #0e0e16; border: 1px solid #7c3aed40; padding: 20px; border-radius: 24px; margin-top: 20px; word-break: break-all; font-family: monospace; font-size: 1.1rem; }
    .site-footer { background: #06060a; border-top: 1px solid #2d2d44; padding: 40px 0; text-align: center; margin-top: 40px; }
    @media (max-width: 640px) { .tool-card { padding: 24px; } }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div class="logo"><h1>🛠️ Free Tools Hub</h1></div>
    <a href="index.html" class="back-home">← Back to Tools</a>
  </div>
</header>
<main class="container">
  <div class="tool-hero"><h2>🔐 Strong Password Generator</h2><p>Create secure, unpredictable passwords instantly</p></div>
  <div class="tool-card">
    <div class="tool-title"><span>⚙️</span> Customize Password</div>
    <div class="input-group"><label>Length:</label><input type="number" id="passLen" min="6" max="48" value="16" style="width:90px;"></div>
    <div class="checkbox-group">
      <label><input type="checkbox" id="incUpper" checked> A-Z</label>
      <label><input type="checkbox" id="incLower" checked> a-z</label>
      <label><input type="checkbox" id="incNum" checked> 0-9</label>
      <label><input type="checkbox" id="incSym" checked> @#$</label>
    </div>
    <button id="genBtn">Generate New Password</button>
    <div class="output" id="passOutput">Click generate to create strong password</div>
  </div>
</main>
<footer class="site-footer"><div class="container"><p>© 2026 Free Tools Hub — Privacy First Password Tool</p></div></footer>
<script>
  const genBtn = document.getElementById('genBtn');
  const passOutput = document.getElementById('passOutput');
  function generate() {
    let len = parseInt(document.getElementById('passLen').value);
    let upper = document.getElementById('incUpper').checked;
    let lower = document.getElementById('incLower').checked;
    let num = document.getElementById('incNum').checked;
    let sym = document.getElementById('incSym').checked;
    let charset = '';
    if(upper) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if(lower) charset += 'abcdefghijklmnopqrstuvwxyz';
    if(num) charset += '0123456789';
    if(sym) charset += '@#$';
    if(!charset) { passOutput.innerText = 'Select at least one option'; return; }
    let pwd = '';
    for(let i=0;i<len;i++) pwd += charset[Math.floor(Math.random() * charset.length)];
    passOutput.innerText = pwd;
  }
  genBtn.addEventListener('click', generate);
  generate();
</script>
</body>
</html>
